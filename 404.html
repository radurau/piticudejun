<script>
  // GitHub Pages serves this for unknown paths. Send everything to the hash router.
  (function () {
    var base = location.pathname.split('/').slice(0, 2).join('/') + '/';
    if (location.hostname.indexOf('github.io') < 0) base = '/';
    location.replace(base + '#/');
  })();
</script>
